<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xylocopa" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/jianpengyao/xylocopa@v__APP_VERSION__/frontend/public/icon-192.png" />
    <title>Xylocopa</title>
    <script>
      // Reload tracing + vite-HMR-reload suppression.
      // Installed BEFORE any ES module loads so we intercept vite client's
      // location.reload() on HMR ws reconnect (which causes PWA white-screen
      // refresh on iOS when the HMR socket flaps).  Other reload sources
      // (user "Retry" buttons, ErrorBoundary, etc.) are logged but allowed.
      (function(){
        try {
          var origReload = window.location.reload.bind(window.location);
          var beacon = function(payload){
            try {
              var body = JSON.stringify(Object.assign({ts: Date.now(), path: location.pathname}, payload));
              if (navigator.sendBeacon) {
                navigator.sendBeacon("/api/debug/auth-diag", new Blob([body], {type:"application/json"}));
              } else {
                fetch("/api/debug/auth-diag", {method:"POST", headers:{"Content-Type":"application/json"}, body: body, keepalive: true});
              }
            } catch(_){}
          };
          Object.defineProperty(window.location, "reload", {
            value: function(){
              var stack = (new Error().stack || "");
              var isVite = /@vite\/client|@vite\/env|vite\/dist\/client/.test(stack);
              beacon({action:"reload-trace", reason:"location.reload", stack: stack.slice(0,1500), isVite: isVite});
              if (isVite) {
                console.warn("[reload-probe] suppressed vite-originated reload");
                return;
              }
              return origReload.apply(window.location, arguments);
            },
            writable: true,
            configurable: true,
          });
          beacon({action:"reload-trace", reason:"patch-installed"});
        } catch(e) {
          try {
            navigator.sendBeacon && navigator.sendBeacon(
              "/api/debug/auth-diag",
              new Blob([JSON.stringify({action:"reload-trace", reason:"patch-failed", error: String(e), ts: Date.now(), path: location.pathname})], {type:"application/json"})
            );
          } catch(_){}
        }
      })();
    </script>
    <script>
      (function(){
        // Force-clear stale PWA caches — MANUAL gate. Bump CV to trigger a
        // one-time unregister+clear+reload across all clients. Intentionally
        // NOT keyed to the per-build hash: the SW (autoUpdate) already picks
        // up new code on next navigation, so a per-build reload here just
        // double-reloaded every client on every rebuild and churned the SW.
        var CV="v4";
        if(navigator.serviceWorker&&!localStorage.getItem("ah-cv-"+CV)){
          navigator.serviceWorker.getRegistrations().then(function(regs){
            var p=regs.map(function(r){return r.unregister()});
            return Promise.all(p);
          }).then(function(){return caches.keys()}).then(function(ns){
            return Promise.all(ns.map(function(n){return caches.delete(n)}));
          }).then(function(){
            localStorage.setItem("ah-cv-"+CV,"1");
            location.reload();
          }).catch(function(){});
          return; // stop further init until reload
        }
        // Theme init — read new key, fall back to legacy "agenthive-theme".
        // Also restore the palette class (theme-soft-dark, theme-custom, …)
        // chosen for that base so first paint matches; see src/lib/themes.js.
        var s=localStorage.getItem("xylocopa-theme")||localStorage.getItem("agenthive-theme");
        var d=window.matchMedia("(prefers-color-scheme:dark)").matches;
        var base=(s==="dark"||(s!=="light"&&d))?"dark":"light";
        if(base==="dark")document.documentElement.classList.add("dark");
        var p=localStorage.getItem("xy:palette-"+base);
        if(p&&p!==base){
          document.documentElement.classList.add("theme-"+p);
          if(p==="custom"){
            // Injected here (mid-<head>) it lands BEFORE the bundled CSS,
            // which is what lets html.eink / html.no-glass still win ties.
            var css=localStorage.getItem("xy:custom-theme-css");
            if(css){var st=document.createElement("style");st.id="xy-custom-theme";st.textContent=css;document.head.appendChild(st);}
          }
        }
        var mc=localStorage.getItem("xy:themecolor-"+base)||(base==="dark"?"#030712":"#ffffff");
        document.querySelector('meta[name="theme-color"]').setAttribute("content",mc);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Self-heal stale SW pointing at deleted chunk hashes.
      // The PWA service worker can serve a cached index.html that references
      // /assets/index-XXXX.js after the file was deleted by a rebuild.
      // Capture-phase 'error' listener catches resource 404s on script/link
      // tags (regular bubbling listeners don't see these). Recovery is
      // gated by sessionStorage to prevent infinite reload loops.
      (function(){
        // Last recover() time. A timestamp, not a flag cleared on 'load':
        // 'load' fires even when the main chunk failed, so a cleared flag let
        // a persistent failure wipe+reload in a tight loop.
        var KEY="xy-chunk-recover", MIN_GAP_MS=30000;
        // Does the server answer at all (any HTTP status)? The query string
        // keeps the request out of the SW precache, so it really hits the
        // network. GET, not HEAD: HEAD of a static file over HTTP/2 leaks a
        // file descriptor in the preview server. Without fetch or
        // AbortController assume yes (the old wipe).
        function serverReachable(){
          if(!window.fetch || !window.AbortController) return Promise.resolve(true);
          var ctl = new AbortController();
          var t = setTimeout(function(){ ctl.abort(); }, 8000);
          return fetch("/manifest.webmanifest?_xs=" + Date.now(), {cache:"no-store", signal: ctl.signal})
            .then(function(){ return true; }, function(){ return false; })
            .then(function(ok){ clearTimeout(t); return ok; });
        }
        // Reload once a reload can work. A page controlled by the SW gets
        // its auto-retrying offline page if the server is still down; an
        // uncontrolled one (right after a wipe) would get the browser's
        // dead error page, so it waits here until the server answers.
        function reloadWhenSafe(){
          if(navigator.serviceWorker && navigator.serviceWorker.controller){ location.reload(); return; }
          serverReachable().then(function(ok){ if(ok) location.reload(); else setTimeout(reloadWhenSafe, 5000); });
        }
        // Wipe the SW + caches only when the server is reachable, i.e. the
        // failure is local (stale build, broken precache). While the server
        // is unreachable a wipe cannot help: it removes the SW's
        // auto-retrying offline page and the push subscription, and the
        // reload then lands on the browser's dead error page. A plain reload
        // instead goes through the SW, which answers with that offline page.
        function recover(){
          try {
            if(Date.now() - Number(sessionStorage.getItem(KEY) || 0) < MIN_GAP_MS) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch(_){}
          serverReachable().then(function(reachable){
            if(!reachable){ reloadWhenSafe(); return; }
            var unreg = (navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
              ? navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))})
              : Promise.resolve();
            unreg.then(function(){
              return ("caches" in window) ? caches.keys().then(function(ns){return Promise.all(ns.map(function(n){return caches.delete(n)}))}) : null;
            }).catch(function(){}).then(function(){
              var u = new URL(location.href);
              u.searchParams.set("_xr", Date.now());
              location.replace(u.toString());
            });
          });
        }
        window.addEventListener("error", function(e){
          var t = e && e.target;
          if(!t || t === window) return;
          var src = t.src || t.href || "";
          if(typeof src !== "string") return;
          if(!/\/assets\/.+\.(js|css|mjs)(\?|$)/.test(src)) return;
          recover();
        }, true);
        // Only genuine module-import failures (stale chunk hash / wrong MIME)
        // count. The generic fetch errors ("Load failed" on Safari,
        // "NetworkError" on Firefox) that used to be matched here fire for
        // ANY failed request during a network blip, and recover() would then
        // unregister the SW and replace the page mid-outage — turning a
        // transient drop into a dead error page. Likewise skip while the
        // browser knows it is offline: a reload cannot help.
        window.addEventListener("unhandledrejection", function(e){
          var msg = (e && e.reason && (e.reason.message || e.reason)) || "";
          msg = String(msg);
          if(/Failed to fetch dynamically imported module|error loading dynamically imported module|Importing a module script failed|is not a valid JavaScript MIME type|disallowed MIME type/i.test(msg)){
            if(navigator.onLine === false) return;
            recover();
          }
        });
        // Boot timeout: if React hasn't mounted within 20s, the SW or
        // a broken chunk is blocking startup. (A merely slow link with the
        // server reachable also ends up wiped here.)
        var _bootTimer = setTimeout(function(){
          if(!document.getElementById("root").firstChild) recover();
        }, 20000);
        window.addEventListener("load", function(){
          clearTimeout(_bootTimer);
          try {
            // The app loaded: clear the offline page's bounce tracking
            // (see public/sw-navigation.js).
            sessionStorage.removeItem("xy-offline-probe-ok");
            sessionStorage.removeItem("xy-offline-bounces");
          } catch(_){}
          // Report what the offline page saw while the server was
          // unreachable (logged as AUTH_DIAG action=offline-page) — only
          // once the app has really mounted: 'load' also fires when the
          // main chunk failed, and the record would be lost unsent.
          setTimeout(function(){
            try {
              var d = JSON.parse(localStorage.getItem("xy-offline-diag") || "null");
              if(!d || !d.probes || !navigator.sendBeacon || !document.getElementById("root").firstChild) return;
              var why = "offline " + Math.round(((d.last||0) - (d.first||0)) / 1000) + "s before " + new Date(d.last||0).toISOString() +
                ": probes=" + d.probes + " timeouts=" + (d.timeouts||0) + " errors=" + (d.errors||0) + " last=" + (d.why||"?");
              if(navigator.sendBeacon("/api/debug/auth-diag", new Blob([JSON.stringify({action:"offline-page", reason: why, path: location.pathname, ts: Date.now()})], {type:"application/json"})))
                localStorage.removeItem("xy-offline-diag");
            } catch(_){}
          }, 3000);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

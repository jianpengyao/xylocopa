<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: the web view extends under the status bar and
         env(safe-area-inset-top) reports its height. "default" was tried on
         iOS 27 (2026-09-23) and made it worse: the view still sat under the
         bar but the inset became 0, so the header slid beneath the clock.
         The iOS 26+ scroll-edge blur under the bar is handled in CSS with
         --ios-status-blur-pad (index.css). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xylocopa" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/jianpengyao/xylocopa@v__APP_VERSION__/frontend/public/icon-192.png" />
    <title>Xylocopa</title>
    <script>
      // Reload tracing + vite-HMR-reload suppression.
      // Installed BEFORE any ES module loads so we intercept vite client's
      // location.reload() on HMR ws reconnect (which causes PWA white-screen
      // refresh on iOS when the HMR socket flaps).  Other reload sources
      // (user "Retry" buttons, ErrorBoundary, etc.) are logged but allowed.
      (function(){
        try {
          var origReload = window.location.reload.bind(window.location);
          var beacon = function(payload){
            try {
              var body = JSON.stringify(Object.assign({ts: Date.now(), path: location.pathname}, payload));
              if (navigator.sendBeacon) {
                navigator.sendBeacon("/api/debug/auth-diag", new Blob([body], {type:"application/json"}));
              } else {
                fetch("/api/debug/auth-diag", {method:"POST", headers:{"Content-Type":"application/json"}, body: body, keepalive: true});
              }
            } catch(_){}
          };
          Object.defineProperty(window.location, "reload", {
            value: function(){
              var stack = (new Error().stack || "");
              var isVite = /@vite\/client|@vite\/env|vite\/dist\/client/.test(stack);
              beacon({action:"reload-trace", reason:"location.reload", stack: stack.slice(0,1500), isVite: isVite});
              if (isVite) {
                console.warn("[reload-probe] suppressed vite-originated reload");
                return;
              }
              return origReload.apply(window.location, arguments);
            },
            writable: true,
            configurable: true,
          });
          beacon({action:"reload-trace", reason:"patch-installed"});
        } catch(e) {
          try {
            navigator.sendBeacon && navigator.sendBeacon(
              "/api/debug/auth-diag",
              new Blob([JSON.stringify({action:"reload-trace", reason:"patch-failed", error: String(e), ts: Date.now(), path: location.pathname})], {type:"application/json"})
            );
          } catch(_){}
        }
      })();
    </script>
    <script>
      (function(){
        // Force-clear stale PWA caches — MANUAL gate. Bump CV to trigger a
        // one-time unregister+clear+reload across all clients. Intentionally
        // NOT keyed to the per-build hash: the SW (autoUpdate) already picks
        // up new code on next navigation, so a per-build reload here just
        // double-reloaded every client on every rebuild and churned the SW.
        var CV="v4";
        if(navigator.serviceWorker&&!localStorage.getItem("ah-cv-"+CV)){
          navigator.serviceWorker.getRegistrations().then(function(regs){
            var p=regs.map(function(r){return r.unregister()});
            return Promise.all(p);
          }).then(function(){return caches.keys()}).then(function(ns){
            return Promise.all(ns.map(function(n){return caches.delete(n)}));
          }).then(function(){
            localStorage.setItem("ah-cv-"+CV,"1");
            location.reload();
          }).catch(function(){});
          return; // stop further init until reload
        }
        // Theme init — read new key, fall back to legacy "agenthive-theme".
        // Also restore the palette class (theme-soft-dark, theme-custom, …)
        // chosen for that base so first paint matches; see src/lib/themes.js.
        var s=localStorage.getItem("xylocopa-theme")||localStorage.getItem("agenthive-theme");
        var d=window.matchMedia("(prefers-color-scheme:dark)").matches;
        var base=(s==="dark"||(s!=="light"&&d))?"dark":"light";
        if(base==="dark")document.documentElement.classList.add("dark");
        var p=localStorage.getItem("xy:palette-"+base);
        if(p&&p!==base){
          document.documentElement.classList.add("theme-"+p);
          if(p==="custom"){
            // Injected here (mid-<head>) it lands BEFORE the bundled CSS,
            // which is what lets html.eink / html.no-glass still win ties.
            var css=localStorage.getItem("xy:custom-theme-css");
            if(css){var st=document.createElement("style");st.id="xy-custom-theme";st.textContent=css;document.head.appendChild(st);}
          }
        }
        var mc=localStorage.getItem("xy:themecolor-"+base)||(base==="dark"?"#030712":"#ffffff");
        document.querySelector('meta[name="theme-color"]').setAttribute("content",mc);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Self-heal stale SW pointing at deleted chunk hashes.
      // The PWA service worker can serve a cached index.html that references
      // /assets/index-XXXX.js after the file was deleted by a rebuild.
      // Capture-phase 'error' listener catches resource 404s on script/link
      // tags (regular bubbling listeners don't see these). Recovery is
      // gated by sessionStorage to prevent infinite reload loops.
      (function(){
        var KEY="xy-chunk-recover";
        function recover(){
          try { if(sessionStorage.getItem(KEY)==="1") return; sessionStorage.setItem(KEY,"1"); } catch(_){}
          var unreg = (navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
            ? navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))})
            : Promise.resolve();
          unreg.then(function(){
            return ("caches" in window) ? caches.keys().then(function(ns){return Promise.all(ns.map(function(n){return caches.delete(n)}))}) : null;
          }).catch(function(){}).then(function(){
            var u = new URL(location.href);
            u.searchParams.set("_xr", Date.now());
            location.replace(u.toString());
          });
        }
        window.addEventListener("error", function(e){
          var t = e && e.target;
          if(!t || t === window) return;
          var src = t.src || t.href || "";
          if(typeof src !== "string") return;
          if(!/\/assets\/.+\.(js|css|mjs)(\?|$)/.test(src)) return;
          recover();
        }, true);
        window.addEventListener("unhandledrejection", function(e){
          var msg = (e && e.reason && (e.reason.message || e.reason)) || "";
          msg = String(msg);
          if(/Failed to fetch dynamically imported module|error loading dynamically imported module|Importing a module script failed|is not a valid JavaScript MIME type|disallowed MIME type|FetchEvent.*network error|network error.*FetchEvent|Load failed|NetworkError when attempting to fetch/i.test(msg)){
            recover();
          }
        });
        // Boot timeout: if React hasn't mounted within 20s, the SW or
        // a broken chunk is blocking startup. Clear everything and reload.
        var _bootTimer = setTimeout(function(){
          if(!document.getElementById("root").firstChild) recover();
        }, 20000);
        window.addEventListener("load", function(){
          clearTimeout(_bootTimer);
          try { sessionStorage.removeItem(KEY); } catch(_){}
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
